name: Traffic collection (every 15 minutes)
on:
  schedule:
    - cron: "*/15 * * * *"    # GitHub may delay or skip runs under load; the app labels late data DELAYED
  workflow_dispatch: {}
concurrency:
  group: traffic
  cancel-in-progress: false
jobs:
  traffic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Collect TomTom traffic
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: python -m scripts.run_collector traffic
